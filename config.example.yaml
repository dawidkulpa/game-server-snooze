listen_addr: ":8211"
server_addr: "192.0.2.10:8211"
max_sessions: 32
max_packet_size: 65507
game: "palworld"

idle_timeout: 30s
auto_stop_delay: 1m
startup_timeout: 5m
startup_poll_interval: 2s
startup_settle_delay: 5s
startup_buffer_packets: 32
startup_buffer_bytes_per_session: 262144
startup_buffer_bytes_global: 4194304

# The native Palworld 1.0 egg reports running only after authenticated REST
# and the marked gameplay UDP listener are both ready.
backend_readiness_mode: "pterodactyl"
backend_readiness_addr: ""

# Keep signature mode in production. Add current-client hexadecimal prefixes
# after an attended compatibility test.
wake_policy: "signature"
wake_signatures:
  - "09080004bc597e73"
log_unmatched_prefixes: false
diagnostic_prefix_bytes: 8

health_addr: "127.0.0.1:8080"
log_level: "info"

pterodactyl:
  base_url: "https://panel.example.com"
  api_token: ""
  server_id: "example-server-id"
